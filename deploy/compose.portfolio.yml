# Adds the portfolio to final-cut's stack and points its nginx at it.
# Run from the final-cut repo, layered after its own compose files:
#
#   docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.prod.yml \
#     -f /path/to/portfolio/deploy/compose.portfolio.yml \
#     up -d --build
#
# Requires these in final-cut's .env (or the shell env):
#   PORTFOLIO_DOMAIN=andrewbilenduke.com        # <-- your portfolio domain
#   NUXT_PUBLIC_DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/...
#
# `context` assumes the portfolio repo is checked out next to final-cut on the
# host. Adjust the path, or swap `build:` for `image:` if you push to a registry
# (mirroring final-cut/docker-compose.registry.yml).

services:
  portfolio:
    build:
      context: ../portfolio
      target: production
      args:
        NUXT_PUBLIC_DISCORD_WEBHOOK_URL: ${NUXT_PUBLIC_DISCORD_WEBHOOK_URL:-}
    container_name: portfolio
    environment:
      # Runtime config — changing this does NOT require a rebuild (SSR).
      - NUXT_PUBLIC_DISCORD_WEBHOOK_URL=${NUXT_PUBLIC_DISCORD_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD", "deno", "eval", "await fetch('http://127.0.0.1:3000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Extend the existing nginx service: give it the portfolio vhost's env and
  # make it wait for the portfolio to be healthy. (Compose merges these onto
  # final-cut's nginx definition.)
  nginx:
    environment:
      - PORTFOLIO_DOMAIN=${PORTFOLIO_DOMAIN}
      - PORTFOLIO_SSL_CERTIFICATE=/etc/letsencrypt/live/${PORTFOLIO_DOMAIN}/fullchain.pem
      - PORTFOLIO_SSL_CERTIFICATE_KEY=/etc/letsencrypt/live/${PORTFOLIO_DOMAIN}/privkey.pem
    depends_on:
      portfolio:
        condition: service_healthy
