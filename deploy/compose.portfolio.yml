# Standalone portfolio deploy (BUILD variant) — INDEPENDENT of final-cut.
#
# Same as compose.registry.yml but builds the image locally instead of pulling
# from GHCR. Use for a manual/local build deploy. Run from the portfolio repo:
#   docker compose -p portfolio --env-file .env -f deploy/compose.portfolio.yml up -d --build portfolio
#
# Like the registry variant, it only defines the portfolio container and joins
# final-cut's network (external) — it never references final-cut's compose.

services:
  portfolio:
    build:
      context: ..
      target: production
    image: portfolio:local
    container_name: portfolio
    environment:
      - NUXT_PUBLIC_DISCORD_WEBHOOK_URL=${NUXT_PUBLIC_DISCORD_WEBHOOK_URL:-}
    networks:
      - web
    healthcheck:
      test: ["CMD", "deno", "eval", "await fetch('http://127.0.0.1:3000/')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped

networks:
  web:
    external: true
    name: final-cut_default
