# Standalone portfolio deploy — INDEPENDENT of final-cut's compose.
#
# This file defines ONLY the portfolio container and attaches it to final-cut's
# existing Docker network (declared `external`), so final-cut's nginx reaches it
# as portfolio:3000. It never references final-cut's docker-compose.yml, so a
# portfolio deploy physically cannot create, recreate, or re-env any final-cut
# service. The only thing final-cut provides is the nginx vhost conf in its
# conf.d (deploy/nginx/portfolio.conf.template).
#
# Deployed (by .github/workflows/release.yml) as its own compose project:
#   cd /opt/portfolio
#   docker compose -p portfolio --env-file /opt/portfolio/.env \
#     -f deploy/compose.registry.yml up -d portfolio

services:
  portfolio:
    image: ghcr.io/abilenduke/portfolio:${IMAGE_TAG:-latest}
    container_name: portfolio
    environment:
      - NUXT_PUBLIC_DISCORD_WEBHOOK_URL=${NUXT_PUBLIC_DISCORD_WEBHOOK_URL:-}
    networks:
      - web
    healthcheck:
      test: ["CMD", "deno", "eval", "await fetch('http://127.0.0.1:3000/')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped

networks:
  web:
    external: true
    name: final-cut_default
